<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f4c4a">
<title>Alo Rio · Check-in</title>
<style>
:root{
  --ink:#1d2624; --muted:#5d6b68; --line:#d9e0dd; --bg:#f6f3ee; --card:#fff;
  --brand:#0f4c4a; --brand2:#e07a3f; --ok:#1f7a4d; --bad:#b3261e;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--brand);color:#fff;padding:18px 16px 16px;padding-top:max(18px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto}
.logo{font-weight:700;font-size:19px;letter-spacing:.2px}
.logo span{color:#f6c9a8}
.langwrap{position:relative;display:flex;align-items:center;gap:6px;background:#fff;color:var(--brand);border-radius:10px;padding:0 10px;height:40px;flex:none}
.langwrap svg{flex:none}
select.lang{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:15px;padding:0 18px 0 0;width:auto;height:40px;outline:none}
.langwrap:after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select.lang option{color:#000}
.intro{max-width:560px;margin:12px auto 0;font-size:15.5px;opacity:.92}
main{max-width:560px;margin:0 auto;padding:14px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14.5px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;font-size:17px;padding:12px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
input[type=checkbox]{width:22px;height:22px;flex:none;margin:0}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;background:#eef2f0;border-radius:12px;padding:4px;gap:4px;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:9px;font-size:15.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
.ok{color:var(--ok);font-weight:600;font-size:15px;margin-top:8px}
.err{color:var(--bad);font-size:14.5px;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px;color:var(--ink)}
.gh{display:flex;justify-content:space-between;align-items:center}
.rm{border:0;background:none;color:var(--bad);font-size:14.5px;padding:6px}
.add{width:100%;border:2px dashed var(--brand);background:transparent;color:var(--brand);font-weight:600;font-size:16px;padding:14px;border-radius:var(--r)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,238,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 12px max(12px,env(safe-area-inset-bottom))}
.bar button{display:block;width:100%;max-width:560px;margin:0 auto;border:0;background:var(--brand2);color:#fff;font-size:18px;font-weight:700;padding:16px;border-radius:14px}
.bar button:disabled{opacity:.55}
.done{text-align:center;padding:40px 18px}
.done .big{font-size:56px}
.done h2{font-size:22px}
.staysum{background:#eef5f3;border-radius:12px;padding:14px 14px 12px;margin-bottom:4px}
.sumprop{font-weight:700;font-size:18px;color:var(--brand)}
.sumdates{font-size:16px;margin-top:2px}
.sumcode{font-size:13.5px;color:var(--muted);margin-top:6px}
.alreadybox{background:#e3f3ea;color:#1f5f3c;border-radius:12px;padding:12px 14px;margin:10px 0 2px;font-size:15px}
.alreadybox b{display:block;margin-bottom:2px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Alo<span>Rio</span> · check-in</div>
    <label class="langwrap" for="lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><select class="lang" id="lang" aria-label="Idioma / Language">
      <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option>
      <option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="ja">日本語</option>
    </select></label>
  </div>
  <p class="intro" data-t="intro"></p>
</header>

<main id="app">
  <section class="card">
    <h2 data-t="stay"></h2>
    <div id="staySum" class="staysum hidden">
      <div class="sumprop" id="sumProp"></div>
      <div class="sumdates" id="sumDates"></div>
      <div class="sumcode" id="sumCode"></div>
    </div>
    <div id="noStay" class="err hidden" data-t="nolink"></div>
    <div id="already" class="alreadybox hidden"><b id="alreadyT"></b><div id="alreadyN"></div><div class="hint" data-t="alreadyHint"></div></div>
    <div id="stayIn" class="hidden">
    <label for="prop" data-t="prop"></label>
    <select id="prop">
      <option value="skydreams">Sky Dreams (2706)</option>
      <option value="vista">Vista Panorâmica (2009)</option>
      <option value="casamaria">Casa Maria (Santa Teresa)</option>
      <option value="casaquerida">Casa querida (Santa Teresa)</option>
    </select>
    <label for="code" data-t="code"></label>
    <input id="code" autocapitalize="characters" autocomplete="off" placeholder="HM........" maxlength="10">
    <div class="hint" data-t="codehint"></div>
    <div class="row">
      <div><label for="cin" data-t="cin"></label><input id="cin" type="date"></div>
      <div><label for="cout" data-t="cout"></label><input id="cout" type="date"></div>
    </div>
    </div>
    <div class="row">
      <div><label for="motivo" data-t="why"></label><select id="motivo"></select></div>
      <div><label for="transp" data-t="how"></label><select id="transp"></select></div>
    </div>
  </section>

  <div id="guests"></div>
  <button class="add" id="addGuest" type="button" data-t="add"></button>

  <section class="card">
    <label class="chk"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
    <div class="err hidden" id="formErr"></div>
  </section>
</main>

<section id="done" class="done hidden">
  <div class="big">✓</div>
  <h2 data-t="thanks"></h2>
  <p data-t="thanks2"></p>
</section>

<div class="bar" id="bar"><button id="send" type="button" data-t="send"></button></div>

<template id="gtpl">
  <section class="card guest">
    <div class="gh"><h2 class="gtitle"></h2><button class="rm" type="button" data-t="remove"></button></div>
    <div class="seg"><button type="button" class="on" data-k="passport" data-t="tpass"></button><button type="button" data-k="cpf" data-t="tcpf"></button></div>

    <div class="pass">
      <label data-t="pnum"></label><input class="pnum" autocapitalize="characters" autocomplete="off">
      <label data-t="given"></label><input class="given" autocomplete="given-name">
      <label data-t="surname"></label><input class="surname" autocomplete="family-name">
      <label data-t="nat"></label><select class="nat"></select>
      <div class="row">
        <div><label data-t="dob"></label><input class="pdob" type="date"></div>
        <div><label data-t="sex"></label><select class="sex"></select></div>
      </div>
      <label data-t="res"></label><select class="res"></select>
    </div>

    <div class="cpfbox hidden">
      <label data-t="cpf"></label><input class="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14">
            <div class="hint" data-t="cpfhint"></div>
      <div class="ok hidden cpfok"></div><div class="err hidden cpferr"></div>
      <div class="cpfman hidden"><label data-t="fullname"></label><input class="cname" autocomplete="name"><label data-t="dob"></label><input class="cdob" type="date"></div>
    </div>
    <label class="chk minor-only"><input type="checkbox" class="minor"><span data-t="minor"></span></label>
  </section>
</template>

ja:{fullname:"氏名",cpfmanual:"政府システムでこのCPFが見つかりません。氏名と生年月日を入力してください。",cpfwait:"現在CPFを確認できません。このまま送信できます。",already:"登録済み：",alreadyHint:"まだ登録していない方だけ追加してください。",allDone:"全員すでに登録済みです ✓",nolink:"Airbnbのメッセージ内のリンクからこのページを開くと、ご予約が表示されます。",intro:"ブラジルの法律により、すべての宿泊者は観光省（FNRH）への登録が必要です。1人あたり約1分で終わります。入力内容は公式システムに直接送られます。",stay:"ご滞在",prop:"宿泊先",code:"Airbnb予約コード",codehint:"HMで始まるコードです。Airbnbアプリの旅行ページにあります。",cin:"チェックイン",cout:"チェックアウト",why:"旅行の目的",how:"リオへの交通手段",add:"+ 宿泊者を追加",consent:"入力内容が正しいことを確認し、ブラジルの法律で定められた宿泊者登録に使用することに同意します。",send:"送信する",sending:"送信中…",thanks:"完了しました。ありがとうございます！",thanks2:"登録を受け付けました。リオでお会いしましょう。",remove:"削除",tpass:"パスポート",tcpf:"ブラジル人（CPF）",photo:"パスポートの写真",photohint:"顔写真のあるページ。タップするとカメラが開きます。",pnum:"旅券番号",given:"名（ミドルネーム含む）",surname:"姓",nat:"国籍",dob:"生年月日",sex:"性別",res:"居住国",cpf:"CPF",cpfhint:"CPFだけで大丈夫です。残りは政府側で補完されます。",email:"メール",phone:"WhatsApp",minor:"18歳未満",guest:"宿泊者",main:"代表者",found:"確認:",cpfbad:"CPFが正しくありません。",cpfnf:"CPFが見つかりません。番号をご確認ください。",e_code:"予約コードを確認してください（HM＋8文字）。",e_dates:"チェックイン・チェックアウト日を確認してください。",e_guest:"入力が不足しています：",e_consent:"同意にチェックしてください。",e_server:"送信できませんでした。もう一度お試しいただくか、Airbnbでご連絡ください。",sx:["男性","女性","その他","回答しない"],mv:{LAZER_FERIAS:"観光・休暇",NEGOCIOS:"ビジネス",PARENTES_AMIGOS:"家族・友人訪問",CONGRESSO_FEIRA:"会議・展示会",ESTUDOS_CURSOS:"留学・研修",SAUDE:"医療",RELIGIAO:"宗教",COMPRAS:"買い物"},tr:{AVIAO:"飛行機",AUTOMOVEL:"車",ONIBUS:"バス",NAVIO_BARCO:"船",MOTO:"バイク",TREM:"電車",BICICLETA:"自転車",PE:"徒歩"}}
};
const SEXV=["HOMEM","MULHER","OUTRO","NAOINFORMADO"];
const TOP=["BR","US","AR","GB","FR","DE","ES","PT","IT","CL","CO","MX","UY","CA","NL","AU","JP"];
const ALL="AD AE AF AG AL AM AO AR AT AU AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FM FR GA GB GD GE GH GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IN IQ IR IS IT JM JO JP KE KG KH KI KM KN KP KR KW KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MO MR MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PS PR PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SY SZ TD TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VN VU WS XK YE ZA ZM ZW".split(" ");

const qs=new URLSearchParams(location.search);
let L=qs.get("lang")||((navigator.language||"pt").slice(0,2));
if(!T[L])L="pt";
const $=s=>document.querySelector(s);
const t=k=>T[L][k]??T.en[k]??k;

function countries(sel,def){
  const dn=new Intl.DisplayNames([L],{type:"region"});
  const cur=sel.value||def||"";
  const name=c=>{try{return dn.of(c)}catch(e){return c}};
  const rest=ALL.filter(c=>!TOP.includes(c)).sort((a,b)=>name(a).localeCompare(name(b),L));
  sel.innerHTML='<option value=""></option>'+TOP.map(c=>`<option value="${c}">${name(c)}</option>`).join("")+'<option disabled>──────────</option>'+rest.map(c=>`<option value="${c}">${name(c)}</option>`).join("");
  sel.value=cur;
}
function fillSelect(sel,map,keep){const v=sel.value;sel.innerHTML=Object.entries(map).map(([k,lab])=>`<option value="${k}">${lab}</option>`).join("");sel.value=keep&&v?v:sel.options[0].value;}

function applyLang(){
  document.documentElement.lang=L; $("#lang").value=L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  fillSelect($("#motivo"),t("mv"),true); fillSelect($("#transp"),t("tr"),true);
  document.querySelectorAll(".guest").forEach(g=>{
    countries(g.querySelector(".nat")); countries(g.querySelector(".res"));
    const sx=g.querySelector(".sex"),v=sx.value; sx.innerHTML='<option value=""></option>'+t("sx").map((s,i)=>`<option value="${SEXV[i]}">${s}</option>`).join(""); sx.value=v;
  });
  renumber();
  if(typeof STAY!=="undefined"&&STAY)showStay();
}
function renumber(){
  document.querySelectorAll(".guest").forEach((g,i)=>{
    g.querySelector(".gtitle").textContent=i===0?t("main"):`${t("guest")} ${i+1}`;
    g.querySelector(".rm").classList.toggle("hidden",i===0);
    g.querySelector(".minor-only").classList.toggle("hidden",i===0);
  });
}

const fmtCpf=v=>v.replace(/\D/g,"").slice(0,11).replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,"$1.$2.$3-$4");

function addGuest(){
  const g=$("#gtpl").content.firstElementChild.cloneNode(true);
  g.dataset.kind=L==="pt"?"cpf":"passport";
  const segs=g.querySelectorAll(".seg button");
  const setKind=k=>{g.dataset.kind=k;segs.forEach(b=>b.classList.toggle("on",b.dataset.k===k));g.querySelector(".pass").classList.toggle("hidden",k!=="passport");g.querySelector(".cpfbox").classList.toggle("hidden",k!=="cpf");};
  segs.forEach(b=>b.onclick=()=>setKind(b.dataset.k));
  setKind(g.dataset.kind);
  const nat=g.querySelector(".nat"),res=g.querySelector(".res");
  nat.onchange=()=>{if(!res.dataset.touched)res.value=nat.value};
  res.onchange=()=>res.dataset.touched=1;
  const cpf=g.querySelector(".cpf");
  cpf.oninput=()=>{cpf.value=fmtCpf(cpf.value);if(cpf.value.replace(/\D/g,"").length===11)check();};
  async function check(){
    const ok=g.querySelector(".cpfok"),er=g.querySelector(".cpferr"),man=g.querySelector(".cpfman");
    const c=cpf.value.replace(/\D/g,"");if(c.length!==11)return;
    if(g._checked===c)return; g._checked=c;
    ok.classList.add("hidden");er.classList.add("hidden");man.classList.add("hidden");g._cpfState="checking";
    try{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"lookup",cpf:c})}).then(r=>r.json());
      if(cpf.value.replace(/\D/g,"")!==c)return;
      if(r.ok){g._cpfState="ok";ok.textContent=`✓ ${t("found")} ${r.name}`;ok.classList.remove("hidden");}
      else if(r.error==="bad_cpf"){g._cpfState="bad";er.textContent=t("cpfbad");er.classList.remove("hidden");}
      else if(r.error==="not_found"){g._cpfState="manual";er.textContent=t("cpfmanual");er.classList.remove("hidden");man.classList.remove("hidden");}
      else{g._cpfState="unknown";er.textContent=t("cpfwait");er.classList.remove("hidden");g._checked=null;}
    }catch(e){g._cpfState="unknown";g._checked=null;er.textContent=t("cpfwait");er.classList.remove("hidden");}
  }
  cpf.onblur=check;
  g.querySelector(".rm").onclick=()=>{g.remove();renumber();};
  $("#guests").appendChild(g);
  applyLang();
  return g;
}

function collect(){
  const err=m=>{const e=$("#formErr");e.textContent=m;e.classList.remove("hidden");e.scrollIntoView({behavior:"smooth",block:"center"});return null;};
  $("#formErr").classList.add("hidden");
  if(!STAY)return err(t("nolink"));
  const code=STAY.code;
  const cin=$("#cin").value,cout=$("#cout").value;
  if(!cin||!cout||cout<=cin)return err(t("e_dates"));
  const guests=[];
  for(const [i,g] of [...document.querySelectorAll(".guest")].entries()){
    const who=i===0?t("main"):`${t("guest")} ${i+1}`;
    const v=s=>g.querySelector(s).value.trim();
    let o;
    if(g.dataset.kind==="cpf"){
      const c=v(".cpf").replace(/\D/g,"");
      if(c.length!==11)return err(`${t("e_guest")} ${who}.`);
      if(g._cpfState==="bad")return err(`${t("cpfbad")} (${who})`);
      o={kind:"cpf",cpf:c};
      if(g._cpfState==="manual"){o.name=v(".cname");o.dob=v(".cdob");if(!o.name||!o.dob)return err(`${t("e_guest")} ${who}.`);}
    }else{
      o={kind:"passport",passport:v(".pnum"),given:v(".given"),surname:v(".surname"),nationality:v(".nat"),dob:v(".pdob"),sex:v(".sex")||"NAOINFORMADO",residence:v(".res")||v(".nat")};
      if(o.passport.length<5||!o.given||!o.surname||!o.nationality||!o.dob)return err(`${t("e_guest")} ${who}.`);
    }
    if(i===0){o.principal=true;}
    else o.minor=g.querySelector(".minor").checked;
    guests.push(o);
  }
  if(!$("#consent").checked)return err(t("e_consent"));
  return {action:"submit",expected:parseInt(qs.get("n")||"0",10)||null,lang:L,stay:{property:$("#prop").value,code,checkin:cin,checkout:cout},motivo:$("#motivo").value,transporte:$("#transp").value,guests};
}

$("#send").onclick=async()=>{
  const body=collect(); if(!body)return;
  const b=$("#send"); b.disabled=true; b.textContent=t("sending");
  try{
    const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
    if(r.ok){if(r.duplicate){$("#done h2").textContent=t("allDone");}$("#app").classList.add("hidden");$("#bar").classList.add("hidden");$("#done").classList.remove("hidden");scrollTo(0,0);}
    else{const e=$("#formErr");e.textContent=r.error==="bad_code"?t("e_code"):r.error==="bad_dates"?t("e_dates"):t("e_server");e.classList.remove("hidden");}
  }catch(e){const er=$("#formErr");er.textContent=t("e_server");er.classList.remove("hidden");}
  b.disabled=false; b.textContent=t("send");
};

$("#lang").onchange=e=>{L=e.target.value;applyLang();};
$("#addGuest").onclick=()=>{const g=addGuest();g.scrollIntoView({behavior:"smooth"});};

const PN={skydreams:"Sky Dreams · Av. Treze de Maio 47, apto 2706",vista:"Vista Panorâmica · Av. Treze de Maio 47, apto 2009",casamaria:"Casa Maria · Santa Teresa",casaquerida:"Casa querida · Santa Teresa"};
let STAY=null;
const fd=d=>{try{return new Intl.DateTimeFormat(L,{weekday:"short",day:"numeric",month:"short"}).format(new Date(d+"T12:00:00"))}catch(e){return d}};
function showStay(){
  if(!STAY){$("#staySum").classList.add("hidden");$("#stayIn").classList.remove("hidden");return;}
  $("#sumProp").textContent=PN[STAY.property]||STAY.property;
  $("#sumDates").textContent=`${fd(STAY.checkin)}  →  ${fd(STAY.checkout)}`;
  $("#sumCode").textContent=`${t("code")}: ${STAY.code}`;
  $("#staySum").classList.remove("hidden");$("#stayIn").classList.add("hidden");
  $("#prop").value=STAY.property;$("#code").value=STAY.code;$("#cin").value=STAY.checkin;$("#cout").value=STAY.checkout;
}
let ALREADY=0;
function showAlready(reg){
  if(!reg||!reg.count)return; ALREADY=reg.count;
  $("#alreadyT").textContent=`${t("already")} ${reg.count}`;
  $("#alreadyN").textContent=reg.names.join(", ");
  $("#already").classList.remove("hidden");
  const want=Math.max(1,NWANT-reg.count); const cards=[...document.querySelectorAll(".guest")];
  for(let i=cards.length-1;i>=want;i--)cards[i].remove(); renumber();
}
async function findStay(code){
  code=(code||"").toUpperCase().replace(/\s/g,"");
  if(!/^HM[A-Z0-9]{8}$/.test(code))return;
  try{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"stay",code})}).then(r=>r.json());
    if(r.ok){STAY={code,property:r.property,checkin:r.checkin,checkout:r.checkout};showStay();showAlready(r.registered);}}catch(e){}
}
const P={skydreams:1,vista:1,casamaria:1,casaquerida:1};
if(P[qs.get("p")])$("#prop").value=qs.get("p");
if(qs.get("in"))$("#cin").value=qs.get("in");
if(qs.get("out"))$("#cout").value=qs.get("out");
$("#code").oninput=e=>{e.target.value=e.target.value.toUpperCase();if(e.target.value.length===10)findStay(e.target.value);};
if(qs.get("c")){$("#code").value=qs.get("c").toUpperCase();findStay(qs.get("c")).finally(()=>{if(!STAY)$("#noStay").classList.remove("hidden");});}else{$("#noStay").classList.remove("hidden");}
const NWANT=Math.min(50,parseInt(qs.get("n")||"1",10)||1);
addGuest();
for(let i=1;i<NWANT;i++)addGuest();
scrollTo(0,0);
</script>
</body>
