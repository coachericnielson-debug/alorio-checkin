<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f4c4a">
<title>Alo Rio · Registros</title>
<style>
:root{--ink:#1d2624;--muted:#5d6b68;--line:#d9e0dd;--bg:#f6f3ee;--brand:#0f4c4a;--ok:#1f7a4d;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fbe6e4;--warn:#8a5a00;--warnbg:#fff1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
header h1{margin:0;font-size:19px}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:10px 12px 40px}
h2{font-size:15px;color:var(--muted);font-weight:600;margin:18px 4px 8px}
.stay{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prop{font-weight:700}
.dates{font-size:14.5px;color:var(--muted);margin-top:2px}
.badge{flex:none;font-size:13.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}
.bad{background:var(--badbg);color:var(--bad)}
.warn{background:var(--warnbg);color:var(--warn)}
.people{font-size:14.5px;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;border:1px solid var(--line);background:#f7faf9;border-radius:10px;padding:9px;font-size:14.5px;color:var(--brand);font-weight:600}
.code{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);padding:20px 6px}
</style>
</head>
<body>
<header><h1>Alo Rio · registros FNRH</h1><p id="sub">Carregando…</p></header>
<main id="m"></main>
<script>
const API="https://zztnayiobjwdxktflivz.supabase.co/functions/v1/alorio-checkin";
const LINK="https://coachericnielson-debug.github.io/alorio-checkin/";
const PN={skydreams:"Sky Dreams 2706",vista:"Vista Panorâmica 2009",casamaria:"Casa Maria",casaquerida:"Casa querida"};
const k=new URLSearchParams(location.search).get("k");
const fd=d=>new Intl.DateTimeFormat("pt-BR",{weekday:"short",day:"numeric",month:"short"}).format(new Date(d+"T12:00:00"));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  const r=await fetch(`${API}?status=${encodeURIComponent(k||"")}`);
  if(!r.ok){document.getElementById("sub").textContent="Link sem acesso.";return;}
  const d=await r.json(); const t=d.today;
  const tomorrow=new Date(Date.parse(t)+86400e3).toISOString().slice(0,10);
  const groups={now:[],soon:[],later:[],past:[]};
  for(const s of d.stays){
    if(s.checkout<=t)groups.past.push(s);
    else if(s.checkin<=t)groups.now.push(s);
    else if(s.checkin<=tomorrow)groups.soon.push(s);
    else groups.later.push(s);
  }
  const missing=[...groups.now,...groups.soon].filter(s=>!s.people.length).length;
  document.getElementById("sub").textContent=missing?`${missing} hospedagem(ns) hoje/amanhã sem registro`:"Hoje e amanhã: tudo registrado";
  const sec=(title,list)=>list.length?`<h2>${title}</h2>`+list.map(card).join(""):"";
  document.getElementById("m").innerHTML=
    sec("Hospedados agora",groups.now)+sec("Chegam hoje ou amanhã",groups.soon)+sec("Próximas",groups.later)+sec("Saíram (últimos dias)",groups.past)||'<p class="empty">Nenhuma reserva.</p>';
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="Copiado ✓";setTimeout(()=>b.textContent="Copiar link do hóspede",1500)}catch(e){prompt("Link:",b.dataset.copy)}});
}
function card(s){
  const n=s.people.length;
  const badge=s.needs_review?'<span class="badge warn">conferir</span>':n?`<span class="badge ok">✓ ${n} ${n>1?"pessoas":"pessoa"}</span>`:'<span class="badge bad">falta registro</span>';
  const ppl=n?`<div class="people">${s.people.map(p=>esc(p.name.split(" ").slice(0,2).join(" "))).join(", ")}</div>`:"";
  const link=`${LINK}?c=${s.code}`;
  return `<div class="stay"><div class="top"><div><div class="prop">${PN[s.property]||s.property}</div><div class="dates">${fd(s.checkin)} → ${fd(s.checkout)}</div></div>${badge}</div>${ppl}
  <div class="actions"><button data-copy="${link}">Copiar link do hóspede</button></div><div class="code">${s.code}${s.checked_in?" · check-in feito":""}${s.checked_out?" · check-out feito":""}</div></div>`;
}
load();
</script>
</body>
</html>
